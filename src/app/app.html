<div class="d-flex flex-column min-vh-100 bg-light">
  <app-navbar></app-navbar>

  @if (productoService.avisoFalloDocente()) {
    <div class="container mt-3">
      <div class="alert alert-warning border-warning shadow-sm d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2" role="alert">
        <div>
          <strong class="d-block text-dark">
            Aviso de Conectividad con la API del Docente:
          </strong>
          <span class="small text-secondary">
            {{ productoService.avisoFalloDocente() }}
          </span>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <button type="button" class="btn btn-sm btn-outline-dark" (click)="reintentarDocente()">
            Reintentar API Docente
          </button>
          <button type="button" class="btn-close" (click)="cerrarAviso()" aria-label="Cerrar"></button>
        </div>
      </div>
    </div>
  }

  <app-encabezado
    titulo="Catálogo de productos"
    [totalProductos]="totalProductos"
    [totalStockBajo]="totalStockBajo" />
  <main class="flex-grow-1">
    <router-outlet></router-outlet>
  </main>
  <footer class="bg-white border-top py-3 text-center text-muted small mt-auto">
    <div class="container">
      UPN SIST1402A &bull; Soluciones Web y Aplicaciones Distribuidas &bull; Laboratorio 08 (V3 Corregido)
    </div>
  </footer>
</div>
