<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" routerLink="/productos">
      <span class="text-primary">SWAD</span> Lab 08 - Catálogo de Productos
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Catálogo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos/nuevo" routerLinkActive="active">Nuevo Producto</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2">
        @if (!editandoUrl) {
          <span class="badge bg-secondary font-monospace text-truncate" style="max-width: 280px;" title="{{ productoService.getUrl() }}">
            API: {{ productoService.getUrl() }}
          </span>
          <button class="btn btn-sm btn-outline-light" type="button" (click)="toggleEditUrl()">Cambiar URL</button>
        } @else {
          <div class="input-group input-group-sm" style="max-width: 420px;">
            <input type="text" class="form-control" [(ngModel)]="apiUrlEdit" placeholder="https://codespace-8080.app.github.dev/api/productos">
            <button class="btn btn-success" type="button" (click)="guardarUrl()">Guardar</button>
            <button class="btn btn-outline-secondary" type="button" (click)="toggleEditUrl()">Cancelar</button>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
