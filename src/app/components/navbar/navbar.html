<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" routerLink="/productos">
      <span class="text-primary">SWAD</span> Lab 08 - Catálogo de Productos
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Catálogo</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos/nuevo" routerLinkActive="active">Nuevo Producto</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        @if (!editandoUrl) {
          @if (productoService.usandoBackendLocal()) {
            <span class="badge bg-warning text-dark border border-warning shadow-sm" title="API del docente inaccesible. Backend local de respaldo activo.">
              Backend Local :8080 (Respaldo)
            </span>
          } @else {
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle">
              {{ tipoBackend }}
            </span>
          }
          <span class="badge bg-secondary font-monospace text-truncate" style="max-width: 260px;" title="{{ productoService.getUrl() }}">
            {{ productoService.getUrl() }}
          </span>
          <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-light" type="button" (click)="toggleEditUrl()">Cambiar URL</button>
            <button class="btn btn-outline-secondary" type="button" (click)="restablecerPredeterminada()" title="Restablecer a API del Docente en Codespaces">↺ Reset</button>
          </div>
        } @else {
          <div class="d-flex gap-1 align-items-center flex-wrap">
            <div class="btn-group btn-group-sm">
              <button type="button" class="btn btn-outline-info" (click)="seleccionarPreset(DOCENTE_URL)">Docente (Codespace)</button>
              <button type="button" class="btn btn-outline-warning" (click)="seleccionarPreset(LOCAL_URL)">Localhost:8080</button>
            </div>
            <div class="input-group input-group-sm" style="max-width: 380px;">
              <input type="text" class="form-control font-monospace small" [(ngModel)]="apiUrlEdit" placeholder="https://codespace-8080.app.github.dev/api/productos">
              <button class="btn btn-success" type="button" (click)="guardarUrl()">Guardar</button>
              <button class="btn btn-outline-secondary" type="button" (click)="toggleEditUrl()">Cancelar</button>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
